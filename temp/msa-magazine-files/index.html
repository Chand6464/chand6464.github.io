<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files</title>
    <style>
        body {
            background-color: #0f0f10;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .password-gate {
            max-width: 360px;
            margin: 20vh auto 0;
            padding: 24px;
            background-color: #1a1a1c;
            border: 2px solid #0ff1a9;
            border-radius: 8px;
            text-align: center;
        }

        .password-gate input,
        .password-gate button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font: inherit;
        }

        .password-gate input {
            margin: 12px 0;
            border: 1px solid #777;
        }

        .password-gate button {
            background-color: #0ff1a9;
            border: 0;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin: 12px auto;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid #fff;
            padding: 8px 16px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <main>
        <form class="password-gate" id="password-gate">
            <h1>Enter password</h1>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Continue</button>
            <p id="password-error" role="alert" hidden>Incorrect password. Please try again.</p>
        </form>

        <section id="protected-content" hidden>
            <h1 style="text-align: center; text-decoration: underline;">Files</h1>
            <br><br>
            <p style="text-align: center;">
                <a href="https://www.dropbox.com/scl/fo/4lkmjyivch9bqasg2r40h/AG0cT34YaZudpGy4WV_F8j0?rlkey=9erqu753cg9iuzeenlvx5a699&amp;st=nhmhbcvr&amp;dl=0">--- Open Folder ---</a>
                <br>
                <a href="https://www.dropbox.com/request/f1u4odskk01lolmw668v">--- Upload Files ---</a>
                <br>
                <a href="https://www.dropbox.com/scl/fo/4lkmjyivch9bqasg2r40h/AG0cT34YaZudpGy4WV_F8j0?rlkey=9erqu753cg9iuzeenlvx5a699&amp;st=nhmhbcvr&amp;dl=1">--- Download Folder (as .zip) ---</a>
            </p>
        </section>
    </main>
    <script>
        const gate = document.getElementById("password-gate");
        const passwordInput = document.getElementById("password");
        const passwordError = document.getElementById("password-error");
        const protectedContent = document.getElementById("protected-content");
        const pagePassword = "msamagazine26";

        gate.addEventListener("submit", (event) => {
            event.preventDefault();

            if (passwordInput.value === pagePassword) {
                gate.hidden = true;
                protectedContent.hidden = false;
                passwordError.hidden = true;
            } else {
                passwordError.hidden = false;
                passwordInput.select();
            }
        });
    </script>
</body>
</html>
